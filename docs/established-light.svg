<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="signify: established in 2022, continuously maintained since then, 34+ tagged releases across five years">
  <title>signify - established 2022, continuously maintained, 34+ tagged releases</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef5fd"/>
      <stop offset="1" stop-color="#e4eefb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#0b66c3" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0b66c3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b66c3" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0b66c3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b66c3"/>
      <stop offset="1" stop-color="#3d8bfd"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b66c3" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3d8bfd" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7f9cc0" flood-opacity="0.28"/>
    </filter>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="200" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="200" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="19.5" fill="none" stroke="#d3e0ef"/>
  <rect x="40" y="0" width="520" height="2" fill="url(#edge)"/>

  <circle cx="70" cy="66" r="48" fill="url(#halo)"/>
  <path d="M70 28 L100 40 V66 C100 86 86 98 70 104 C54 98 40 86 40 66 V40 Z" fill="url(#mark)"/>
  <rect x="56" y="60" width="28" height="22" rx="4" fill="#ffffff"/>
  <path d="M61 60 V54 A9 9 0 0 1 79 54 V60" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="70" cy="69" r="2.6" fill="#0b66c3"/>
  <rect x="68.9" y="69" width="2.2" height="6" rx="1.1" fill="#0b66c3"/>

  <text x="124" y="46" class="mono" font-size="12" letter-spacing="2.6" fill="#0b66c3">ESTABLISHED 2022</text>
  <text x="124" y="80" class="sans" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#0f172a">Continuously maintained since 2022</text>
  <text x="124" y="106" class="mono" font-size="12.5" fill="#5b6b82">open source &#183; pure Go &#183; zero dependencies &#183; battle-tested</text>

  <g filter="url(#soft)">
    <rect x="742" y="24" width="418" height="88" rx="14" fill="#ffffff" stroke="#d7e3f2"/>
    <path d="M774 38 L778.8 48.8 L790 49.8 L781.5 57.2 L784.1 68 L774 62.2 L763.9 68 L766.5 57.2 L758 49.8 L769.2 48.8 Z" fill="#d97706"/>
    <text x="806" y="52" class="mono" font-size="14" fill="#0f172a">github.com/paepckehh/signify</text>
    <text x="806" y="76" class="mono" font-size="11.5" fill="#64748b">BSD-3-Clause &#183; OpenBSD / minisign wire</text>
    <text x="806" y="96" class="mono" font-size="11.5" fill="#64748b">2022 &#8594; 2026 &#183; continuously maintained</text>
  </g>

  <line x1="40" y1="128" x2="1160" y2="128" stroke="#dbe7f4"/>

  <text x="40" y="166" class="sans" font-size="32" font-weight="700" fill="#0b66c3">34+</text>
  <text x="40" y="184" class="mono" font-size="9.5" letter-spacing="1.8" fill="#5b6b82">TAGGED RELEASES</text>

  <text x="300" y="146" class="mono" font-size="9.5" letter-spacing="1.8" fill="#5b6b82">RELEASES / YEAR</text>
  <line x1="300" y1="176" x2="1140" y2="176" stroke="#c7d7ea"/>

  <g fill="url(#mark)">
    <rect x="308" y="172" width="64" height="4" rx="2"/>
    <rect x="488" y="140" width="64" height="36" rx="6"/>
    <rect x="668" y="173" width="64" height="3" rx="1.5"/>
    <rect x="848" y="172" width="64" height="4" rx="2"/>
    <rect x="1028" y="154" width="64" height="22" rx="6"/>
  </g>

  <g class="mono" font-size="10.5" text-anchor="middle" fill="#0b4a8f">
    <text x="340" y="166">2</text>
    <text x="520" y="134">18</text>
    <text x="700" y="167">1</text>
    <text x="880" y="166">2</text>
    <text x="1060" y="148">11</text>
  </g>

  <g class="mono" font-size="10.5" text-anchor="middle" fill="#64748b">
    <text x="340" y="192">2022</text>
    <text x="520" y="192">2023</text>
    <text x="700" y="192">2024</text>
    <text x="880" y="192">2025</text>
  </g>
  <rect x="1032" y="181" width="56" height="16" rx="8" fill="#e3f0ff" stroke="#b6d4f7"/>
  <text x="1060" y="193" class="mono" font-size="10.5" text-anchor="middle" fill="#0b66c3">2026</text>
</svg>
