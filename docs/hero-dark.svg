<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">signify: pure Go Ed25519 signatures compatible with OpenBSD signify and minisign</title>
  <desc id="desc">Wire format overview: public key 42 bytes, private key 74 bytes, signature 74 bytes, each starting with the Ed algorithm tag and an 8 byte fingerprint.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131c29"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#58a6ff" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="19.5" fill="none" stroke="#243044"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="112" font-size="58" font-weight="700" fill="#f0f6fc">🔏 signify</text>
    <text x="64" y="156" font-size="22" font-weight="600" fill="#58a6ff">Ed25519 signatures. OpenBSD compatible. Zero dependencies.</text>
    <text x="64" y="194" font-size="17" fill="#9aa7b8">Sign and verify like OpenBSD signify / minisign,</text>
    <text x="64" y="218" font-size="17" fill="#9aa7b8">and keep private key handling in your application.</text>
    <g font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect x="64" y="242" width="120" height="26" rx="13" fill="#161f2e" stroke="#2b3a50"/>
      <text x="124" y="259" text-anchor="middle" fill="#79c0ff">pure Go</text>
      <rect x="192" y="242" width="132" height="26" rx="13" fill="#161f2e" stroke="#2b3a50"/>
      <text x="258" y="259" text-anchor="middle" fill="#79c0ff">stdlib only</text>
      <rect x="332" y="242" width="104" height="26" rx="13" fill="#161f2e" stroke="#2b3a50"/>
      <text x="384" y="259" text-anchor="middle" fill="#79c0ff">no CGO</text>
      <rect x="444" y="242" width="112" height="26" rx="13" fill="#161f2e" stroke="#2b3a50"/>
      <text x="500" y="259" text-anchor="middle" fill="#79c0ff">no go.sum</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g>
      <text x="680" y="76" font-size="15" font-weight="700" fill="#f0f6fc">public key</text>
      <text x="1140" y="76" font-size="13" fill="#8b949e" text-anchor="end">42 bytes</text>
      <rect x="680" y="88" width="52" height="34" rx="6" fill="url(#bar)"/>
      <text x="706" y="110" font-size="14" font-weight="700" fill="#0b1117" text-anchor="middle">Ed</text>
      <rect x="740" y="88" width="104" height="34" rx="6" fill="#1b2a3f"/>
      <text x="792" y="110" font-size="13" fill="#a5c9f2" text-anchor="middle">fingerprint</text>
      <text x="852" y="110" font-size="12" fill="#6f8bab" text-anchor="middle">8</text>
      <rect x="852" y="88" width="288" height="34" rx="6" fill="#161f2e" stroke="#2b3a50"/>
      <text x="996" y="110" font-size="13" fill="#c9d1d9" text-anchor="middle">ed25519 public key</text>
      <text x="1116" y="110" font-size="12" fill="#6f8bab" text-anchor="middle">32</text>
    </g>
    <g>
      <text x="680" y="152" font-size="15" font-weight="700" fill="#f0f6fc">private key</text>
      <text x="1140" y="152" font-size="13" fill="#8b949e" text-anchor="end">74 bytes</text>
      <rect x="680" y="164" width="52" height="34" rx="6" fill="url(#bar)"/>
      <text x="706" y="186" font-size="14" font-weight="700" fill="#0b1117" text-anchor="middle">Ed</text>
      <rect x="740" y="164" width="104" height="34" rx="6" fill="#1b2a3f"/>
      <text x="792" y="186" font-size="13" fill="#a5c9f2" text-anchor="middle">fingerprint</text>
      <text x="852" y="186" font-size="12" fill="#6f8bab" text-anchor="middle">8</text>
      <rect x="852" y="164" width="288" height="34" rx="6" fill="#161f2e" stroke="#2b3a50"/>
      <text x="996" y="186" font-size="13" fill="#c9d1d9" text-anchor="middle">ed25519 private key</text>
      <text x="1116" y="186" font-size="12" fill="#6f8bab" text-anchor="middle">64</text>
    </g>
    <g>
      <text x="680" y="228" font-size="15" font-weight="700" fill="#f0f6fc">signature</text>
      <text x="1140" y="228" font-size="13" fill="#8b949e" text-anchor="end">74 bytes</text>
      <rect x="680" y="240" width="52" height="34" rx="6" fill="url(#bar)"/>
      <text x="706" y="262" font-size="14" font-weight="700" fill="#0b1117" text-anchor="middle">Ed</text>
      <rect x="740" y="240" width="104" height="34" rx="6" fill="#1b2a3f"/>
      <text x="792" y="262" font-size="13" fill="#a5c9f2" text-anchor="middle">fingerprint</text>
      <text x="852" y="262" font-size="12" fill="#6f8bab" text-anchor="middle">8</text>
      <rect x="852" y="240" width="288" height="34" rx="6" fill="#161f2e" stroke="#2b3a50"/>
      <text x="996" y="262" font-size="13" fill="#c9d1d9" text-anchor="middle">ed25519 signature</text>
      <text x="1116" y="262" font-size="12" fill="#6f8bab" text-anchor="middle">64</text>
    </g>
  </g>
</svg>
